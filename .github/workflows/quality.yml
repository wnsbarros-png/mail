name: Quality and security

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Slint's generated application is large; simultaneous lib/test rustc jobs
  # can exhaust runner memory before any tests start.
  CARGO_BUILD_JOBS: "1"

jobs:
  quality:
    if: github.event_name != 'schedule'
    name: Format, lint, and test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Probe runner disk and free it (forced)
        shell: bash
        run: |
          df -h /
          swapon --show || true
          free -h
          docker system df || true
          nohup bash -c 'while :; do printf "%s %s\n" "$(date +%s)" "$(df -k --output=used / | tail -1)" >> "$RUNNER_TEMP/disk-used"; sleep 5; done' < /dev/null > /dev/null 2>&1 &
          avail() { df -k --output=avail / | tail -1; }
          for d in /usr/local/lib/android /usr/share/dotnet /usr/local/.ghcup /opt/ghc "${RUNNER_TOOL_CACHE:?}/CodeQL" /usr/share/swift /usr/local/julia* /usr/share/miniconda /opt/az /opt/microsoft /usr/local/share/chromium /usr/local/share/powershell; do
            if [[ ! -e $d ]]; then echo "absent: $d"; continue; fi
            before=$(avail); start=$(date +%s.%N)
            sudo rm -rf "$d"
            end=$(date +%s.%N); after=$(avail)
            awk -v d="$d" -v k=$((after - before)) -v s="$start" -v e="$end" 'BEGIN { printf "%-36s freed %6.2f GiB in %5.1f s\n", d, k / 1048576, e - s }'
          done
          before=$(avail); start=$(date +%s.%N)
          sudo docker image prune --all --force > /dev/null || true
          end=$(date +%s.%N); after=$(avail)
          awk -v k=$((after - before)) -v s="$start" -v e="$end" 'BEGIN { printf "%-36s freed %6.2f GiB in %5.1f s\n", "docker images", k / 1048576, e - s }'
          df -h /
          df -k --output=used / | tail -1 > "$RUNNER_TEMP/disk-used-after-cleanup"
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            dbus-daemon \
            gettext \
            gnupg \
            libdbus-1-dev \
            libfontconfig1-dev \
            libx11-dev \
            libx11-xcb-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxcursor-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            pkg-config \
            ripgrep
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: quality-default
          save-if: false
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Leave translation catalogs to Weblate
        # Weblate's msgmerge add-on owns lang/*/LC_MESSAGES; edits from other
        # branches conflict with its pending commits and lock the component.
        if: >-
          github.event_name == 'pull_request' &&
          !(github.head_ref == 'weblate-flectar-mail-mail' &&
            github.event.pull_request.head.repo.full_name == github.repository)
        shell: bash
        run: |
          set -euo pipefail
          # The checkout is the pull request's merge commit; its first parent
          # is the base branch.
          git fetch --quiet --deepen=1 origin "$GITHUB_SHA"
          changed=$(git diff --name-only HEAD^1 HEAD -- 'lang/*/LC_MESSAGES/*.po')
          if [[ -n $changed ]]; then
            printf '%s\n' "$changed"
            echo "::error::Only Weblate edits lang/*/LC_MESSAGES. Commit lang/flectar-mail.pot alone (scripts/update-translation-template.sh) and translate on https://translate.flectar.com/."
            exit 1
          fi
      - name: Validate repository support files
        shell: bash
        run: |
          set -euo pipefail
          find scripts -type f -name '*.sh' -print0 | xargs -0 -n1 bash -n
          python3 - <<'PY'
          import ast
          import json
          import xml.etree.ElementTree as ET
          from pathlib import Path

          for path in Path("scripts").glob("*.py"):
              ast.parse(path.read_text(encoding="utf-8"), filename=str(path))
          for path in Path(".").glob("**/*.json"):
              if "target" not in path.parts:
                  json.loads(path.read_text(encoding="utf-8"))
          for path in Path(".").glob("**/*.xml"):
              if "target" not in path.parts:
                  ET.parse(path)
          PY
          python3 scripts/test-benchmark-startup.py
          python3 ui/icons/lucide/generate.py --check
          python3 resources/app-icon/generate.py --check
      - name: Keep operating-system names in the platform layer
        run: python3 scripts/check-platform-gates.py
      - name: Verify the Blitz patch queue
        run: bash scripts/blitz-patches.sh verify
      - name: Verify and test the Parley backport
        run: |
          python3 scripts/verify-parley.py
          cargo test --manifest-path crates/parley/Cargo.toml --lib --locked --target-dir target/parley-tests
      - name: Verify the Slint winit clipboard backport
        run: python3 scripts/verify-slint-winit.py
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Test release validation and publication
        run: |
          python3 scripts/test-release.py
          python3 scripts/test-pdf-packaging.py
          python3 scripts/test-android-jni.py
          python3 scripts/test-android-oauth.py
          python3 scripts/test-android-signing.py
      - name: Validate Android workspace lockfile
        run: cargo metadata --manifest-path platform/android/Cargo.toml --locked --format-version 1 > /dev/null
      - name: Reject unused direct dependencies
        run: |
          cargo install cargo-machete --locked --version 0.9.2
          cargo machete --with-metadata
      - name: Check every default target
        run: cargo check --workspace --all-targets --locked
      - name: Check the capability-minimal application
        run: cargo check -p flectar-mail --no-default-features --locked
      - name: Check the Flatpak application profile
        run: cargo check -p flectar-mail --no-default-features --features remote-content,gpu-renderer,flatpak --locked
      - name: Check the CPU-only renderer build
        run: cargo check -p flectar-mail --no-default-features --features remote-content --locked
      - name: Lint without warnings
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Validate translations
        shell: bash
        run: |
          cargo install slint-tr-extractor --version 1.18.1 --locked
          bash scripts/check-translations.sh
      - name: Run the default test suite
        run: cargo test --workspace --all-targets --locked
      - name: Test the vendored Blitz patches
        run: cargo test -p blitz-dom --lib --locked
      - name: Exercise the mobile PDF renderer with bundled PDFium on the host
        run: |
          python3 scripts/stage-pdfium.py linux-x64 target/pdfium-mobile-test
          python3 scripts/test-pdf-preview.py --fixture "$RUNNER_TEMP/mobile-preview.pdf"
          FLECTAR_TEST_PDFIUM="$PWD/target/pdfium-mobile-test/libpdfium.so" \
          FLECTAR_TEST_PDF="$RUNNER_TEMP/mobile-preview.pdf" \
            cargo test -p flectar-mail --lib --locked mobile_native_pages_and_rejection -- --ignored

      - name: Report disk usage
        if: always()
        shell: bash
        run: |
          df -h /
          base=$(cat "$RUNNER_TEMP/disk-used-after-cleanup")
          peak=$(awk 'max < $2 { max = $2 } END { print max }' "$RUNNER_TEMP/disk-used")
          awk -v b="$base" -v p="$peak" 'BEGIN { printf "used after cleanup %.2f GiB, peak %.2f GiB, job peak need %.2f GiB\n", b / 1048576, p / 1048576, (p - b) / 1048576 }'
          du -sh target ~/.cargo/registry ~/.cargo/git ~/.rustup 2>/dev/null || true
          du -sh target/* target/debug/* 2>/dev/null | sort -h | tail -12
